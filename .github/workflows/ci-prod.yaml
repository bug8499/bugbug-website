name: CI Dev

on:
  push:
    branches:
      - dev
permissions:
  contents: write
jobs:
  deploy:
    uses: bug8499/IaC-GitOps-Vultr/.github/workflows/argocicd.yml@main
    with:
      service_name: app1
      environment: dev
      image_tag: ${{ github.sha }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}